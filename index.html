<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>NEXUS — Online Banking</title><link rel="stylesheet" href="css/nexus.css"></head><body><div class="splash" id="splash"><div class="splash-inner"><div class="splash-logo">N</div><div class="splash-title">NEXUS</div><div class="splash-sub">Secure Online Banking</div><div class="splash-bar"><i></i></div></div></div><script type="module">import {supabase,profileFor,profileIsActive,profileIsDeleted} from './js/supabase.js';setTimeout(async()=>{try{const {data:{session},error}=await supabase.auth.getSession();if(error)throw error;if(!session){location.replace('login.html');return}const p=await profileFor(session.user.id);location.replace(p?.role==='admin'&&profileIsActive(p)&&!profileIsDeleted(p)?'admin.html':(!profileIsActive(p)||profileIsDeleted(p)?'unavailable.html':'dashboard.html'))}catch(error){console.error('[NEXUS startup]',error);location.replace('login.html')}},5000)</script></body></html>
