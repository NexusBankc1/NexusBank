<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS — Account Unavailable</title><link rel="stylesheet" href="css/nexus.css"></head><body class="unavailable"><section class="unavailable-box"><div class="unavailable-logo">N</div><h1>This account is unavailable at this moment</h1><p>Your NEXUS account is currently unavailable. If you need information or assistance, please contact Customer Care.</p><a id="careBtn" class="btn btn-primary" href="login.html">Customer Care</a><div id="care" class="notice" style="text-align:left;background:#111;color:#ddd;border-color:#292929;margin-top:10px">Loading Customer Care…</div><button id="signOut" class="btn btn-light" style="margin-top:10px">Sign out</button></section><script type="module">import {supabase} from './js/supabase.js';const c=document.querySelector('#care'),b=document.querySelector('#careBtn');const {data}=await supabase.from('platform_settings').select('customer_care_email,customer_care_whatsapp').eq('id',1).maybeSingle();const email=data?.customer_care_email||'support@example.com',wa=(data?.customer_care_whatsapp||'').replace(/\D/g,'');c.innerHTML=`<strong>Customer Care</strong><br>Email: ${email}<br>WhatsApp: ${data?.customer_care_whatsapp||'Not configured'}`;b.href=wa?`https://wa.me/${wa}`:`mailto:${email}`;document.querySelector('#signOut').onclick=async()=>{await supabase.auth.signOut();location.replace('login.html')}</script></body></html>
