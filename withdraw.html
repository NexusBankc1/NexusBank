<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS — Withdraw</title><link rel="stylesheet" href="../css/nexus.css"></head><body><div class="app"><header class="topbar"><div class="brand-block"><div class="brand-mark">N</div><div><div class="brand">NEXUS</div><small>Withdraw Funds</small></div></div><div class="topbar-actions"><a class="icon-btn" href="notifications.html">♧</a><a class="icon-btn" href="support.html">?</a><button id="logoutBtn" class="btn btn-danger">Sign out</button></div></header><main class="content"><section class="card"><span class="eyebrow">Account withdrawal</span><h1>Withdraw Funds</h1><p class="muted">Request a withdrawal from your NEXUS account. Pending requests remain recorded until reviewed.</p><div class="notice"><strong>Available balance</strong><br><span id="balance">Loading…</span></div><form id="withdrawForm" class="form-grid" style="margin-top:14px"><div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div><div class="field"><label>Destination / withdrawal reference</label><input id="destination" placeholder="Bank account or destination reference" required></div><div class="field"><label>Transaction PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" required></div><button class="btn btn-primary btn-wide">Submit Withdrawal</button></form><div id="result" class="notice" style="display:none;margin-top:12px"></div></section></main></div><div id="nav"></div><script type="module" src="../js/pages/withdraw.js"></script></body></html>
